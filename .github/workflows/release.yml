name: Release (draft)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to package; must match <Version> in Directory.Build.props (e.g. 0.2.0)
        required: true
      manual_version:
        description: Exported functional manual to bundle (archive/output/pdf). Defaults to 0.1.1, the latest exported manual.
        required: false
        default: ''

  # workflow_dispatch is only offered once this file is on the default branch. Until then, a push to the
  # release branch that touches this workflow or the release notes packages the version in Directory.Build.props.
  push:
    branches: [gittu/beginner-onboarding]
    paths: ['.github/workflows/release.yml', 'docs/release-notes/**']

env:
  MANUAL_VERSION: ${{ inputs.manual_version || '0.1.1' }}

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Resolve version
        shell: pwsh
        run: |
          $declared = ([xml](Get-Content -Raw Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $requested = '${{ inputs.version }}'
          if ($requested -and $requested -ne $declared) { throw "Input version $requested does not match Directory.Build.props ($declared)." }
          if (-not (Test-Path "docs/release-notes/$declared.md")) { throw "Missing docs/release-notes/$declared.md" }
          "VERSION=$declared" >> $env:GITHUB_ENV
      - name: Build, test and package
        shell: pwsh
        env:
          GITCOMPASS_GITHUB_CLIENT_ID: ${{ vars.GITCOMPASS_GITHUB_CLIENT_ID }}
        run: ./scripts/build.ps1 -Publish -ManualVersion '${{ env.MANUAL_VERSION }}'
      - name: Verify package
        shell: pwsh
        run: ./scripts/verify-package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: GitCompass-${{ env.VERSION }}-win-x64
          path: |
            artifacts/GitCompass-${{ env.VERSION }}-win-x64.zip
            artifacts/GitCompass-${{ env.VERSION }}-win-x64.zip.sha256
          if-no-files-found: error
      - name: Create or update draft prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v${{ env.VERSION }}'
          $zip = 'artifacts/GitCompass-${{ env.VERSION }}-win-x64.zip'
          $notes = 'docs/release-notes/${{ env.VERSION }}.md'
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip "$zip.sha256" --clobber
            gh release edit $tag --draft --prerelease --target $env:GITHUB_SHA --notes-file $notes
          } else {
            gh release create $tag $zip "$zip.sha256" --draft --prerelease --target $env:GITHUB_SHA --title "GitCompass ${{ env.VERSION }} (beta)" --notes-file $notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'gh release failed' }
