name: Release (draft)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to package; must match <Version> in Directory.Build.props (e.g. 0.2.0)
        required: true
      manual_version:
        description: Exported functional manual to bundle (archive/output/pdf). Defaults to the app version.
        required: false
        default: ''

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Check version input
        shell: pwsh
        run: |
          $declared = ([xml](Get-Content -Raw Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($declared -ne '${{ inputs.version }}') { throw "Input version ${{ inputs.version }} does not match Directory.Build.props ($declared)." }
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/build.ps1 -Publish -ManualVersion '${{ inputs.manual_version || inputs.version }}'
      - name: Verify package
        shell: pwsh
        run: ./scripts/verify-package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: GitCompass-${{ inputs.version }}-win-x64
          path: |
            artifacts/GitCompass-${{ inputs.version }}-win-x64.zip
            artifacts/GitCompass-${{ inputs.version }}-win-x64.zip.sha256
          if-no-files-found: error
      - name: Create or update draft prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v${{ inputs.version }}'
          $zip = 'artifacts/GitCompass-${{ inputs.version }}-win-x64.zip'
          $notes = 'docs/release-notes/${{ inputs.version }}.md'
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip "$zip.sha256" --clobber
            gh release edit $tag --draft --prerelease --target $env:GITHUB_SHA --notes-file $notes
          } else {
            gh release create $tag $zip "$zip.sha256" --draft --prerelease --target $env:GITHUB_SHA --title "GitCompass ${{ inputs.version }} (beta)" --notes-file $notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'gh release failed' }
