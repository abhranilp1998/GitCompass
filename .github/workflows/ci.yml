name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build and run test programs
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Practice project checks
        shell: pwsh
        run: dotnet run --project tests/GitCompass.Git.IntegrationTests -c Release --no-build --no-restore -- "C:\Program Files\Git\cmd\git.exe" --practice-only
